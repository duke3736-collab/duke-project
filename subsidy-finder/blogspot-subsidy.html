<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 동네 지원금 찾기 - DUKE PROJECT</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
            --bg-dark: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.95);
            --text-main: #f8fafc;
            --text-dim: #cbd5e1;
            --accent: #3b82f6;
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        .subsidy-widget-container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 36px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 20px auto;
            color: var(--text-main);
            font-family: 'Pretendard', sans-serif;
            overflow: hidden;
        }

        .subsidy-widget-container h1 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            margin: 0 0 32px 0;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .input-group { margin-bottom: 24px; }
        .input-group label { display: block; font-size: 16px; font-weight: 600; color: var(--text-dim); margin-bottom: 10px; }
        
        .subsidy-widget-container select {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 16px 18px;
            color: var(--text-main);
            font-size: 18px;
            outline: none;
        }

        .categories {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 36px;
        }

        .category-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 20px 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .category-item:hover { background: rgba(255, 255, 255, 0.1); }
        .category-item.active {
            background: var(--primary-gradient);
            border-color: transparent;
            box-shadow: 0 8px 20px -4px rgba(59, 130, 246, 0.4);
        }

        .category-icon { font-size: 28px; margin-bottom: 10px; display: block; }
        .category-label { font-size: 14px; font-weight: 600; color: var(--text-dim); }
        .category-item.active .category-label { color: white; }

        .search-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 20px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:disabled { opacity: 0.7; cursor: not-allowed; }

        /* Result Panel Styles */
        .result-panel { margin-top: 28px; animation: slideDown_w 0.4s ease-out; }
        @keyframes slideDown_w { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .divider { height: 1px; background: var(--glass-border); margin: 24px 0; }
        .result-header { font-size: 18px; font-weight: 700; margin-bottom: 20px; }
        .result-count { color: #3b82f6; font-size: 22px; }
        .result-item {
            display: block;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 12px;
            border-left: 4px solid #3b82f6;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .result-item:hover { background: rgba(255, 255, 255, 0.08); transform: translateX(6px); border-left: 4px solid #60a5fa; }
        .result-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
        .result-desc { font-size: 14px; color: var(--text-dim); line-height: 1.4; }
        .result-actions { display: block; margin-top: 20px; }
        .action-btn {
            width: 100%;
            padding: 20px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
        }
        .action-btn.primary { background: var(--primary-gradient); color: white; }
        .pulse { animation: pulseGlow_w 2s infinite; }
        @keyframes pulseGlow_w { 0% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.4); } 70% { box-shadow: 0 0 0 12px rgba(59, 130, 246, 0); } 100% { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); } }

        .footer { margin-top: 24px; text-align: center; font-size: 12px; color: var(--text-dim); }
        .footer a { color: var(--accent); text-decoration: none; }
    </style>
</head>
<body>
    <div class="subsidy-widget-container">
        <h1>내 동네 지원금 찾기</h1>
        
        <div class="input-group">
            <label>어느 지역에 사시나요?</label>
            <select id="regionSelect_widget">
                <option value="">지역을 선택하세요</option>
                <option value="11">서울특별시</option>
                <option value="26">부산광역시</option>
                <option value="27">대구광역시</option>
                <option value="28">인천광역시</option>
                <option value="29">광주광역시</option>
                <option value="30">대전광역시</option>
                <option value="31">울산광역시</option>
                <option value="36">세종특별자치시</option>
                <option value="41">경기도</option>
                <option value="42">강원도</option>
                <option value="43">충청북도</option>
                <option value="44">충청남도</option>
                <option value="45">전라북도</option>
                <option value="46">전라남도</option>
                <option value="47">경상북도</option>
                <option value="48">경상남도</option>
                <option value="50">제주특별자치도</option>
            </select>
        </div>

        <div class="categories">
            <div class="category-item active" data-cat="all">
                <span class="category-icon">✨</span>
                <span class="category-label">전체</span>
            </div>
            <div class="category-item" data-cat="youth">
                <span class="category-icon">🙋‍♂️</span>
                <span class="category-label">청년</span>
            </div>
            <div class="category-item" data-cat="child">
                <span class="category-icon">👶</span>
                <span class="category-label">육아</span>
            </div>
            <div class="category-item" data-cat="senior">
                <span class="category-icon">👴</span>
                <span class="category-label">노인</span>
            </div>
            <div class="category-item" data-cat="smallbiz">
                <span class="category-icon">🏪</span>
                <span class="category-label">소상공인</span>
            </div>
            <div class="category-item" data-cat="housing">
                <span class="category-icon">🏠</span>
                <span class="category-label">주거</span>
            </div>
        </div>

        <button class="search-btn" id="searchBtn_widget">맞춤 지원금 찾기</button>

        <!-- Result Panel -->
        <div class="result-panel" id="resultPanel_widget" style="display: none;">
            <div class="divider"></div>
            <div class="result-header">
                <span class="result-count">3</span>개의 추천 혜택을 찾았습니다!
            </div>
            <div id="resultList_widget"></div>
            <div class="result-actions">
                <button class="action-btn primary pulse" id="blogSearchBtn_widget">내 블로그 검색</button>
            </div>
        </div>

        <div class="footer">
            Powered by <a href="https://lifestyletripnote.blogspot.com" target="_blank">DUKE PROJECT</a>
        </div>
    </div>

    <script>
        (function() {
            const regionSelect = document.getElementById('regionSelect_widget');
            const categoryItems = document.querySelectorAll('.category-item');
            const searchBtn = document.getElementById('searchBtn_widget');
            const resultPanel = document.getElementById('resultPanel_widget');
            const resultList = document.getElementById('resultList_widget');
            const blogSearchBtn = document.getElementById('blogSearchBtn_widget');

            const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRroFNPaye9fhBftcTW3ilBuYOgZ_0nnsvEPP9tq1LlRlpcH3G0NA8GW1JVYvkXjeFEr5yMedc83Wwd/pub?output=csv';
            
            let selectedCategory = 'all';
            let subsidyData = {
                youth: [], child: [], senior: [], smallbiz: [], housing: [], all: []
            };

            // 구글 시트 데이터 로드
            async function fetchSubsidies() {
                try {
                    const response = await fetch(CSV_URL);
                    const csvText = await response.text();
                    parseCSV(csvText);
                } catch (error) {
                    console.error('데이터 로드 실패:', error);
                    subsidyData.all = [{ title: '데이터 로드 실패', desc: '잠시 후 다시 시도해 주세요.', url: '#' }];
                }
            }

            function parseCSV(text) {
                const lines = text.split('\n');
                const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
                
                subsidyData = { youth: [], child: [], senior: [], smallbiz: [], housing: [], all: [] };

                for (let i = 1; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    
                    const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
                    if (!values) continue;

                    const row = {};
                    headers.forEach((header, index) => {
                        row[header] = values[index] ? values[index].replace(/^"|"$/g, '').trim() : '';
                    });

                    const cat = row.category ? row.category.toLowerCase() : 'all';
                    if (subsidyData[cat]) {
                        subsidyData[cat].push({
                            title: row.title,
                            desc: row.description,
                            url: row.url
                        });
                    }
                }
            }

            // 초기화 실행
            fetchSubsidies();

            categoryItems.forEach(item => {
                item.addEventListener('click', () => {
                    categoryItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    selectedCategory = item.getAttribute('data-cat');
                });
            });

            searchBtn.addEventListener('click', () => {
                const region = regionSelect.value;
                if (!region) { alert('지역을 선택해 주세요!'); return; }
                const regionName = regionSelect.options[regionSelect.selectedIndex].text;

                searchBtn.textContent = '🕵️ 분석 중...';
                searchBtn.disabled = true;
                resultPanel.style.display = 'none';

                setTimeout(() => {
                    searchBtn.textContent = '맞춤 지원금 찾기';
                    searchBtn.disabled = false;
                    
                    resultList.innerHTML = '';
                    const items = subsidyData[selectedCategory] || [];
                    
                    if (items.length === 0) {
                        resultList.innerHTML = '<div class="result-desc" style="text-align:center; padding:20px;">준비된 지원금이 없습니다.</div>';
                    } else {
                        items.forEach(item => {
                            const a = document.createElement('a');
                            a.className = 'result-item';
                            a.href = item.url;
                            a.innerHTML = `<div class="result-title">${item.title} <span style="font-size:10px; color:#6366f1;">↗ 공식신청</span></div><div class="result-desc">${item.desc}</div>`;
                            resultList.appendChild(a);
                        });
                    }
                    
                    const catName = document.querySelector('.category-item.active .category-label').textContent;
                    blogSearchBtn.innerHTML = `🎁 <b>${regionName} ${catName !== '전체' ? catName : ''}</b> 숨은 지원금 100% 타먹는 비법 보기 🚨`;

                    resultPanel.style.display = 'block';
                    resultPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }, 1000);
            });

            blogSearchBtn.addEventListener('click', () => {
                const regionName = regionSelect.options[regionSelect.selectedIndex].text;
                const catName = document.querySelector('.category-item.active .category-label').textContent;
                const query = `${regionName} ${catName === '전체' ? '' : catName} 지원금 신청방법`;
                window.location.href = `https://lifestyletripnote.blogspot.com/search?q=${encodeURIComponent(query)}`;
            });
        })();
    </script>
</body>
</html>
